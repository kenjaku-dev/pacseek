<?xml version="1.0" encoding="UTF-8"?>
<!-- pakmap app icon — the same geometry as the UI BrandMark component.
     Regenerate the PNG set with:
       rsvg-convert -w 32  -h 32  pakmap-logo.svg -o 32x32.png
       rsvg-convert -w 128 -h 128 pakmap-logo.svg -o 128x128.png
       rsvg-convert -w 256 -h 256 pakmap-logo.svg -o 128x128@2x.png
       rsvg-convert -w 512 -h 512 pakmap-logo.svg -o icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- tile -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#080d17"/>
  <!-- the "p" — stem -->
  <rect x="17" y="14" width="9" height="38" rx="4" fill="#22c55e"/>
  <!-- the "p" — bowl -->
  <path d="M26 22 h10 c7.2 0 13 5.8 13 13 s-5.8 13 -13 13 h-10 v-9 h10 c2.2 0 4 -1.8 4 -4 s-1.8 -4 -4 -4 h-10 Z" fill="#22c55e"/>
  <!-- package pin dot -->
  <circle cx="42.5" cy="14.5" r="5.5" fill="#38bdf8"/>
</svg>
