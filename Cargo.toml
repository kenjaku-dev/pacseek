[package]
name = "pacseek"
version = "0.2.0"
edition = "2024"
description = "Fast package search for Arch/Artix official repos and AUR — written in Rust"
authors = ["achraf"]
license = "MIT"
repository = "https://github.com/achraf/pacseek"
keywords = ["aur", "pacman", "alpm", "arch", "search"]
categories = ["command-line-utilities"]
readme = "README.md"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "wrap_help"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
alpm = "5"
pacmanconf = "3"
raur = { version = "8", features = ["rustls"] }
colored = "2"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
url = "2"
# TUI stack — ratatui skill (0.30.1) + tui-design ecosystem-rust
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
color-eyre = "0.6"
tui-input = "0.15"
dirs = "5"
nix = { version = "0.29", features = ["user"] }
unicode-width = "0.2"
signal-hook = "0.3"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic = "abort" disabled for TUI stability — color_eyre hook needs unwind to restore terminal (tui-design lifecycle)
# keep unwind so raw/altscreen restored on panic; use `cargo build --release` still stripped and small
panic = "unwind"

[profile.dev]
opt-level = 0
